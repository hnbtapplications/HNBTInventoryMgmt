name: Refurbished app build

on:
  push:
    branches:
      - main
      - refactor/separate-refurbished-management
  pull_request:
    paths:
      - "api/**"
      - "refurbished-laptop-management/**"
      - "refurbished-laptop.html"
      - "vercel.json"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"

jobs:
  root-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Validate serverless API module syntax
        run: for f in api/*.js; do node --check "$f"; done
      - run: npm run build

  refurbished-source-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: refurbished-laptop-management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build

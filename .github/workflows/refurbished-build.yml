name: Refurbished app build

on:
  push:
    branches:
      - refactor/separate-refurbished-management
  pull_request:
    paths:
      - "refurbished-laptop-management/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: refurbished-laptop-management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: refurbished-laptop-management/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build

<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HNBT Inventory | Audit Logs</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#15243b}.top{background:#0c3152;color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between}.top h1{margin:0;font-size:21px}.top a{color:#fff;text-decoration:none;border:1px solid #7890a5;border-radius:8px;padding:9px 14px}.wrap{padding:24px;max-width:1600px;margin:auto}.head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:18px}.head h2{margin:0 0 5px}.muted{color:#718096;font-size:13px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;margin-bottom:16px}input,select,button{height:40px;border:1px solid #d6deea;border-radius:8px;background:#fff;padding:0 12px;font:inherit}button{cursor:pointer;font-weight:600}.card{background:#fff;border:1px solid #dde5ef;border-radius:12px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:1100px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #edf1f6;font-size:13px;vertical-align:top}th{background:#f8fafc;color:#687994;text-transform:uppercase;font-size:11px;letter-spacing:.04em}.pill{display:inline-block;border-radius:20px;padding:4px 9px;background:#e8f4ff;color:#0769aa;font-weight:700;font-size:11px}.empty{padding:45px;text-align:center;color:#718096}.err{background:#fff1f1;color:#a11;padding:12px;border-radius:8px;margin-bottom:12px;display:none}.detail{max-width:320px;white-space:normal;word-break:break-word}@media(max-width:850px){.filters{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}.wrap{padding:14px}}</style></head><body><div class="top"><div><h1>Hertz & Bytes Technologies</h1><div style="font-size:12px;opacity:.8">Inventory Management · Administration</div></div><a href="/">← Back to Inventory</a></div><main class="wrap"><div class="head"><div><h2>Audit Logs</h2><div class="muted">Protected history of product and stock changes. Records cannot be edited or deleted here.</div></div><button onclick="load()">↻ Refresh</button></div><div id="err" class="err"></div><div class="filters"><input id="q" placeholder="Search employee, product, action or details…"><select id="branch"><option value="">All branches</option><option>Bangalore</option><option>Hosur</option></select><select id="action"><option value="">All actions</option></select><input id="date" type="date"><button onclick="clearFilters()">Clear</button></div><div class="card"><table><thead><tr><th>Date & Time</th><th>Employee</th><th>Action</th><th>Product / Item</th><th>Branch</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty">Loading audit history…</div></div></main><script>let logs=[];const $=id=>document.getElementById(id);function fmt(d){try{return new Date(d).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'medium'})}catch{return d||'-'}}function text(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function describe(x){if(x.details)return x.details;const old=x.old_value||{},neu=x.new_value||{};if(x.action==='STOCK_IN'||x.action==='STOCK_OUT')return `${x.action==='STOCK_IN'?'Stock IN':'Stock OUT'}${neu.qty?' · Qty '+neu.qty:''}`;if(x.action==='PRODUCT_UPDATED')return 'Product details updated';if(x.action==='PRODUCT_ADDED')return 'New product created';if(x.action==='PRODUCT_DELETED')return 'Product deleted';if(x.action==='MOVEMENT_EDITED')return 'Stock movement edited';if(x.action==='MOVEMENT_DELETED')return 'Stock movement deleted';return x.action||'-'}function render(){const q=$('q').value.toLowerCase(),b=$('branch').value,a=$('action').value,d=$('date').value;const data=logs.filter(x=>{const hay=`${x.actor} ${x.action} ${x.entity_name} ${x.entity_id} ${x.details}`.toLowerCase();return(!q||hay.includes(q))&&(!b||x.branch===b)&&(!a||x.action===a)&&(!d||String(x.created_at).slice(0,10)===d)});$('rows').innerHTML=data.map(x=>`<tr><td>${text(fmt(x.created_at))}</td><td><strong>${text(x.actor||'Unknown')}</strong></td><td><span class="pill">${text((x.action||'').replaceAll('_',' '))}</span></td><td><strong>${text(x.entity_name||'-')}</strong><br><span class="muted">${text(x.entity_id||'')}</span></td><td>${text(x.branch||'-')}</td><td class="detail">${text(describe(x))}</td></tr>`).join('');$('empty').style.display=data.length?'none':'block';$('empty').textContent=logs.length?'No audit records match the selected filters.':'No audit records yet. Create or edit a product / stock movement to generate the first entry.'}async function load(){try{$('err').style.display='none';const r=await fetch('/api/audit-logs',{credentials:'same-origin'});if(r.status===401){location.href='/';return}const j=await r.json();if(!r.ok)throw Error(j.error||'Unable to load audit logs');logs=j.logs||[];const actions=[...new Set(logs.map(x=>x.action).filter(Boolean))].sort();$('action').innerHTML='<option value="">All actions</option>'+actions.map(a=>`<option>${text(a)}</option>`).join('');render()}catch(e){$('err').textContent=e.message;$('err').style.display='block';$('empty').textContent='Unable to load audit history.'}}function clearFilters(){$('q').value='';$('branch').value='';$('action').value='';$('date').value='';render()}['q','branch','action','date'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));load();</script></body></html>
